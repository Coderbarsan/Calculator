<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="display">
                <input type="text" id="input" placeholder="0" readonly />
                <div class="toggle-mode">
                    <label><input type="radio" name="mode" value="DEG" checked /> DEG</label>
                    <label><input type="radio" name="mode" value="RAD" /> RAD</label>
                </div>
            </div>
            <div class="buttons">
                <button onclick="clearInput()">C</button>
                <button onclick="deleteLast()">DEL</button>
                <button onclick="insert('(')">(</button>
                <button onclick="insert(')')">)</button>

                <button onclick="insert('7')">7</button>
                <button onclick="insert('8')">8</button>
                <button onclick="insert('9')">9</button>
                <button onclick="insert('/')">/</button>

                <button onclick="insert('4')">4</button>
                <button onclick="insert('5')">5</button>
                <button onclick="insert('6')">6</button>
                <button onclick="insert('*')">*</button>

                <button onclick="insert('1')">1</button>
                <button onclick="insert('2')">2</button>
                <button onclick="insert('3')">3</button>
                <button onclick="insert('-')">-</button>

                <button onclick="insert('0')">0</button>
                <button onclick="insert('.')">.</button>
                <button onclick="calculate()">=</button>
                <button onclick="insert('+')">+</button>

                <button onclick="insert('^')">x<sup>y</sup></button>
                <button onclick="insert('sqrt(')">√</button>
                <button onclick="insert('log(')">log</button>
                <button onclick="insert('ln(')">ln</button>

                <button onclick="insert('sin(')">sin</button>
                <button onclick="insert('cos(')">cos</button>
                <button onclick="insert('tan(')">tan</button>
                <button onclick="insert('e')">e</button>
                <button onclick="insert('pi')">π</button>
            </div>
        </div>
        <div class="history">
            <h2>History</h2>
            <ul id="history-list"></ul>
            <button onclick="clearHistory()">Clear History</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
